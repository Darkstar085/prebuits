name: Telegram Delivery

on:
  workflow_run:
    workflows: ["Build and Release"]
    types: [completed]

concurrency:
  group: prebuilts-telegram-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send-telegram:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.TOKEN }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      API_ID: ${{ secrets.TELEGRAM_API_ID }}
      API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      SESSION: ${{ secrets.TELEGRAM_SESSION }}
      TAG: prebuilts-${{ github.event.workflow_run.id }}

    steps:
      - name: Checkout build revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip gh
          python3 -m pip install --disable-pip-version-check --no-cache-dir telethon tgcrypto

      - name: Find release for this build
        id: release
        shell: bash
        run: |
          set -euo pipefail
          echo "Looking for release: ${TAG}"

          for attempt in $(seq 1 30); do
            if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "Release found: ${TAG}"
              echo "found=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Release not available yet (attempt ${attempt}/30). Sleeping 10s..."
            sleep 10
          done

          echo "No release was created for build ${TAG}; nothing to send."
          echo "found=false" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        if: steps.release.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dl
          mkdir -p dl

          gh release download "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "*_v*.apk" \
            --pattern "*_v*.exe" \
            --pattern "captions.txt" \
            --dir dl

          shopt -s nullglob
          files=(dl/*.apk dl/*.exe)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Release contains no app files. Nothing to send."
            exit 0
          fi

          cp dl/captions.txt captions.txt

          printf 'Downloaded files:\n'
          printf ' - %s\n' "${files[@]}"

      - name: Upload apps to Telegram
        if: steps.release.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/upload.py
