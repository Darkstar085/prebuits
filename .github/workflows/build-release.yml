name: Build and Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "*.txt"
      - ".github/workflows/**"
      - ".github/scripts/**"
  schedule:
    - cron: "0 10 * * 0"
      timezone: "Asia/Kolkata"

concurrency:
  group: prebuilts-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.TOKEN }}
      GITHUB_TOKEN: ${{ secrets.TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install aapt and GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt gh

      - name: Build and publish prebuilts
        run: python3 .github/scripts/build.py

      - name: Commit generated metadata
        run: |
          if [ ! -f latest-apk-versions.txt ] || [ ! -f captions.txt ]; then
            echo "Generated metadata files are missing"
            exit 1
          fi

          if git diff --quiet -- latest-apk-versions.txt captions.txt && [ -z "$(git ls-files --others --exclude-standard -- latest-apk-versions.txt captions.txt)" ]; then
            echo "No metadata changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-apk-versions.txt captions.txt

          updated_apps="$(git diff --cached --unified=0 -- latest-apk-versions.txt | grep -E '^\\+[^+].*: ' | sed 's/^+//' || true)"
          updated_count="$(printf '%s\\n' "$updated_apps" | sed '/^$/d' | wc -l | tr -d ' ')"

          date_ist="$(TZ=Asia/Kolkata date '+%Y-%m-%d')"
          time_ist="$(TZ=Asia/Kolkata date '+%H:%M')"

          description="📦 Prebuilts Update"$'\n\n'"📅 Date: ${date_ist}"$'\n'"🕐 Time: ${time_ist} IST"$'\n\n'"✅ Updated apps (${updated_count}):"$'\n'
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            app="${line%%:*}"
            version="${line#*: }"
            description+="- ${app}: ${version}"$'\n'
          done <<< "$updated_apps"

          description+=$'\n'"📁 Updated files:"$'\n'"- latest-apk-versions.txt"$'\n'"- captions.txt"$'\n\n'"🤖 Automated by GitHub Actions"

          git commit -m "Prebuilt Update - ${date_ist}" \
            -m "${description}"
          git push origin HEAD:main
